server {
    listen 80;
    server_name gptchwallet.com www.gptchwallet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gptchwallet.com www.gptchwallet.com;
    ssl_certificate /etc/letsencrypt/live/gptchwallet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gptchwallet.com/privkey.pem;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; font-src 'self' data: https:;";
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /_next/static {
        alias /var/www/gptch-wallet/.next/static;
        expires 365d;
        access_log off;
    }
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
} 